# Выпуск новой версии. Версия берётся из apps/desktop/src-tauri/tauri.conf.json.
# Запуск: GitHub → Actions → Release → Run workflow (ветка main)
# или тегом: git tag v0.6.0 && git push origin v0.6.0.
# Собирает установщик на серверах GitHub, подписывает его ключом обновлений,
# считает SHA-256 и создаёт черновик релиза с latest.json для автообновления.
# Черновик публикуется вручную после проверки — только тогда создаётся тег
# и установленные приложения увидят обновление.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Сборка и черновик релиза
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия тега и приложения совпадают, ключ подписи задан
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ($tag -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с версией приложения $version" }
          } elseif ("${{ github.ref_name }}" -ne "main") {
            throw "Выпуск запускается только из ветки main"
          }
          if ($env:HAS_KEY -ne "true") {
            throw "Не задан секрет TAURI_SIGNING_PRIVATE_KEY (Settings → Secrets and variables → Actions)"
          }
          $notes = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## v' + [regex]::Escape($version) + '[ \t]*\r?\n(.*?)(?=^## |\z)'
          $match = [regex]::Match($notes, $pattern)
          if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            throw "В CHANGELOG.md нет раздела ## v$version"
          }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding utf8 RELEASE_NOTES.md
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Релиз $tag уже есть. Поднимите версию или удалите старый черновик." }
          $global:LASTEXITCODE = 0
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Тесты
        run: pnpm test

      - name: Сборка и подпись .exe
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @twm/desktop tauri build

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Сборка DLL для Amazing Online
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /LD plugins\game-overlay\twm_market.cpp /Fe:twm_market.dll /link user32.lib shell32.lib gdi32.lib

      - name: Файлы выпуска, контрольные суммы и latest.json
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $sig = Get-Item "$($exe.FullName).sig"
          # Имя без пробелов: GitHub заменяет пробелы в именах файлов релиза.
          $name = "TWM-Market_${env:VERSION}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out/$name"
          Copy-Item $sig.FullName "out/$name.sig"
          # Та же программа под постоянным именем: ссылка с сайта
          # …/releases/latest/download/TWM-Market-setup.exe всегда ведёт на последнюю версию.
          $stable = "TWM-Market-setup.exe"
          Copy-Item $exe.FullName "out/$stable"
          Copy-Item twm_market.dll out/twm_market.dll
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash out/twm_market.dll -Algorithm SHA256).Hash.ToLower()
          @("$hash  $name", "$hash  $stable", "$dllHash  twm_market.dll") | Set-Content -Encoding utf8 out/SHA256SUMS.txt
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = (Get-Content RELEASE_NOTES.md -Raw -Encoding utf8).Trim()
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${env:TAG}/$name"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("$PWD/out/latest.json", $json, [Text.UTF8Encoding]::new($false))
          Get-Content out/SHA256SUMS.txt
          Get-Content out/latest.json

      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = (Get-Content RELEASE_NOTES.md -Raw -Encoding utf8).Trim() + "`n`n---`nУстановщик собран автоматически на серверах GitHub из кода этого тега. Перед установкой сверьте SHA-256 из файла SHA256SUMS.txt. Уже установленные приложения обновятся сами."
          $notes | Set-Content -Encoding utf8 notes.md
          # Тег создаётся при публикации черновика — на коммите этой сборки.
          gh release create $env:TAG (Get-ChildItem out/*).FullName `
            --draft `
            --target "${{ github.sha }}" `
            --title "TWM Market $env:TAG" `
            --notes-file notes.md

  # Приложение для Android: собирается после черновика и добавляется в него.
  # Подписывается ключом владельца (секреты ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Обновление поверх
  # установленного приложения возможно, только если ключ тот же.
  # Без ключа шаг пропускается: выпуск для Windows от этого не зависит.
  android:
    name: Android-приложение в черновик релиза
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Ключ подписи задан?
        id: key
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          echo "ok=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Ключ подписи Android не задан — APK в этот выпуск не добавлен (см. deploy/README.md, раздел Android)."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.ok == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Установка зависимостей
        if: steps.key.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Проект Android
        if: steps.key.outputs.ok == 'true'
        working-directory: apps/desktop
        run: bash ../../deploy/android-prepare.sh

      - name: Сборка APK
        if: steps.key.outputs.ok == 'true'
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --ci

      - name: Подпись и загрузка в черновик
        if: steps.key.outputs.ok == 'true'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v$version"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/out"
          name="TWM-Market_${version}_android.apk"
          bash ../../deploy/android-sign.sh "$RUNNER_TEMP/out/$name"
          rm -f "$RUNNER_TEMP/release.jks"
          # Постоянное имя: ссылка с сайта и проверка обновлений в приложении.
          cp "$RUNNER_TEMP/out/$name" "$RUNNER_TEMP/out/TWM-Market.apk"
          cd "$RUNNER_TEMP/out"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern SHA256SUMS.txt
          sha256sum "$name" TWM-Market.apk >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber "$name" TWM-Market.apk SHA256SUMS.txt
