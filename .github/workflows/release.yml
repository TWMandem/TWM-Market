# Выпуск новой версии. Версия берётся из apps/desktop/src-tauri/tauri.conf.json.
# Запуск: GitHub → Actions → Release → Run workflow (ветка main)
# или тегом: git tag v0.6.0 && git push origin v0.6.0.
# Собирает установщик на серверах GitHub, подписывает его ключом обновлений,
# считает SHA-256 и создаёт черновик релиза с latest.json для автообновления.
# Черновик публикуется вручную после проверки — только тогда создаётся тег
# и установленные приложения увидят обновление.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Сборка и черновик релиза
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия тега и приложения совпадают, ключ подписи задан
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ($tag -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с версией приложения $version" }
          } elseif ("${{ github.ref_name }}" -ne "main") {
            throw "Выпуск запускается только из ветки main"
          }
          if ($env:HAS_KEY -ne "true") {
            throw "Не задан секрет TAURI_SIGNING_PRIVATE_KEY (Settings → Secrets and variables → Actions)"
          }
          $notes = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## v' + [regex]::Escape($version) + '[ \t]*\r?\n(.*?)(?=^## |\z)'
          $match = [regex]::Match($notes, $pattern)
          if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            throw "В CHANGELOG.md нет раздела ## v$version"
          }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding utf8 RELEASE_NOTES.md
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Релиз $tag уже есть. Поднимите версию или удалите старый черновик." }
          $global:LASTEXITCODE = 0
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Тесты
        run: pnpm test

      - name: Сборка и подпись .exe
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @twm/desktop tauri build

      - name: Файлы выпуска, контрольные суммы и latest.json
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $sig = Get-Item "$($exe.FullName).sig"
          # Имя без пробелов: GitHub заменяет пробелы в именах файлов релиза.
          $name = "TWM-Market_${env:VERSION}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out/$name"
          Copy-Item $sig.FullName "out/$name.sig"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding utf8 out/SHA256SUMS.txt
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = (Get-Content RELEASE_NOTES.md -Raw -Encoding utf8).Trim()
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${env:TAG}/$name"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("$PWD/out/latest.json", $json, [Text.UTF8Encoding]::new($false))
          Get-Content out/SHA256SUMS.txt
          Get-Content out/latest.json

      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = (Get-Content RELEASE_NOTES.md -Raw -Encoding utf8).Trim() + "`n`n---`nУстановщик собран автоматически на серверах GitHub из кода этого тега. Перед установкой сверьте SHA-256 из файла SHA256SUMS.txt. Уже установленные приложения обновятся сами."
          $notes | Set-Content -Encoding utf8 notes.md
          # Тег создаётся при публикации черновика — на коммите этой сборки.
          gh release create $env:TAG (Get-ChildItem out/*).FullName `
            --draft `
            --target "${{ github.sha }}" `
            --title "TWM Market $env:TAG" `
            --notes-file notes.md
