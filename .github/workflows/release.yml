# Выпуск новой версии. Запускается тегом вида v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
# Собирает установщик на серверах GitHub, считает контрольную сумму SHA-256
# и создаёт черновик релиза. Черновик публикуется вручную после проверки.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Сборка и черновик релиза
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Тесты
        run: pnpm test

      - name: Сборка .exe
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: pnpm --filter @twm/desktop tauri build

      - name: Контрольные суммы
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe).FullName
          gh release create "${{ github.ref_name }}" $exe SHA256SUMS.txt `
            --draft `
            --title "TWM Market ${{ github.ref_name }}" `
            --notes "Установщик собран автоматически на серверах GitHub из кода этого тега. Перед установкой сверьте SHA-256 из файла SHA256SUMS.txt."
