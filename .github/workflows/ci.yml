# Проверки на каждый push и pull request:
# типы, тесты, сборка интерфейса и тестовая сборка установщика для Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы, тесты, сборка интерфейса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: pnpm install

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка сервера
        run: pnpm --filter @twm/api build

      - name: Сборка интерфейса
        run: pnpm --filter @twm/desktop build

  windows:
    name: Сборка установщика Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install

      - name: Сборка .exe
        run: pnpm --filter @twm/desktop tauri build

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: TWM-Market-setup-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
