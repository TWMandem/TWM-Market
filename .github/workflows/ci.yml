# Проверки на каждый push и pull request:
# типы, тесты (с настоящей базой PostgreSQL), сборка интерфейса
# и тестовая сборка установщика для Windows.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # На рабочих ветках обновляет pnpm-lock.yaml, если поменялись зависимости,
  # и коммитит его в ту же ветку. В main lock-файл только проверяется.
  lockfile:
    name: Lock-файл зависимостей
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Обновить pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Закоммитить, если изменился
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Обновить pnpm-lock.yaml"
            git push
          fi

  check:
    name: Типы, тесты, сборка интерфейса
    needs: lockfile
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm
          POSTGRES_DB: twm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://twm:twm@localhost:5432/twm_test
    steps:
      - uses: actions/checkout@v4
        with:
          # На рабочей ветке берём последний коммит, включая свежий lock-файл.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка сервера
        run: pnpm --filter @twm/api build

      - name: Сборка интерфейса
        run: pnpm --filter @twm/desktop build

  # Снимки экранов: сервер с тестовыми данными, интерфейс в браузере Chromium.
  # Картинки — в артефакте screenshots-<коммит>, сводка — на странице запуска.
  screens:
    name: Снимки экранов
    needs: check
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm
          POSTGRES_DB: twm_screens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://twm:twm@localhost:5432/twm_screens
      API_URL: http://localhost:3000
      UI_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка сервера и интерфейса
        env:
          VITE_API_URL: http://localhost:3000
        run: |
          pnpm --filter @twm/api build
          pnpm --filter @twm/desktop exec vite build

      - name: Запуск сервера
        working-directory: apps/api
        env:
          NODE_ENV: development
          # Только для этой проверки: база и сервер живут несколько минут.
          JWT_SECRET: screenshots-jwt-secret-0123456789abcdef0123456789
          CODE_SECRET: screenshots-code-secret-0123456789abcdef012345678
          CORS_ORIGINS: http://localhost:4173
          MAIL_TRANSPORT: console
          RATE_LIMIT: "false"
          UPLOAD_DIR: ${{ runner.temp }}/uploads
        run: |
          node dist/db/migrate-cli.js
          nohup node dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Запуск интерфейса
        working-directory: apps/desktop
        run: |
          nohup pnpm exec vite preview --port 4173 --strictPort > "$RUNNER_TEMP/ui.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/ui.log"; exit 1

      - name: Браузер Chromium
        run: pnpm --filter @twm/screenshots exec playwright install --with-deps chromium

      - name: Тестовые данные
        run: pnpm --filter @twm/screenshots seed

      - name: Снимки
        run: |
          pnpm --filter @twm/screenshots shoot
          cat tools/screenshots/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Журнал сервера
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true

      - name: Сохранить снимки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: |
            tools/screenshots/out/screens/
            tools/screenshots/out/report.md
            tools/screenshots/out/report.json
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Сборка установщика Windows
    needs: check
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка .exe
        # Адрес сервера вшивается в приложение. Задаётся в настройках репозитория:
        # Settings → Secrets and variables → Actions → Variables → API_URL.
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        # Пробная сборка без подписи обновлений: ключ подписи есть только у выпусков (release.yml).
        run: pnpm --filter @twm/desktop tauri build --config src-tauri/tauri.ci.conf.json

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: TWM-Market-setup-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
