# Проверки на каждый push и pull request:
# типы, тесты (с настоящей базой PostgreSQL), сборка интерфейса
# и тестовая сборка установщика для Windows.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # На рабочих ветках обновляет pnpm-lock.yaml, если поменялись зависимости,
  # и коммитит его в ту же ветку. В main lock-файл только проверяется.
  lockfile:
    name: Lock-файл зависимостей
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Обновить pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Закоммитить, если изменился
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Обновить pnpm-lock.yaml"
            git push
          fi

  check:
    name: Типы, тесты, сборка интерфейса
    needs: lockfile
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm
          POSTGRES_DB: twm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://twm:twm@localhost:5432/twm_test
    steps:
      - uses: actions/checkout@v4
        with:
          # На рабочей ветке берём последний коммит, включая свежий lock-файл.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка сервера
        run: pnpm --filter @twm/api build

      - name: Сборка интерфейса
        run: pnpm --filter @twm/desktop build

      - name: Сборка сайта
        run: pnpm --filter @twm/site build

  # Снимки экранов: сервер с тестовыми данными, интерфейс в браузере Chromium.
  # Картинки — в артефакте screenshots-<коммит>, сводка — на странице запуска.
  screens:
    name: Снимки экранов
    needs: check
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # Обычно ~8 минут; зависшая установка браузеров не держит проверку часами.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm
          POSTGRES_DB: twm_screens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://twm:twm@localhost:5432/twm_screens
      API_URL: http://localhost:3000
      UI_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка сервера и интерфейса
        env:
          VITE_API_URL: http://localhost:3000
        run: |
          pnpm --filter @twm/api build
          pnpm --filter @twm/desktop exec vite build
          pnpm --filter @twm/desktop build:web
          pnpm --filter @twm/site build

      - name: Запуск сервера
        working-directory: apps/api
        env:
          NODE_ENV: development
          # Только для этой проверки: база и сервер живут несколько минут.
          JWT_SECRET: screenshots-jwt-secret-0123456789abcdef0123456789
          CODE_SECRET: screenshots-code-secret-0123456789abcdef012345678
          CORS_ORIGINS: http://localhost:4173,http://localhost:4174
          MAIL_TRANSPORT: console
          RATE_LIMIT: "false"
          UPLOAD_DIR: ${{ runner.temp }}/uploads
          # Страница-ссылка берёт картинки с адреса сайта; здесь это сам сервер API.
          SITE_URL: http://localhost:3000
        run: |
          node dist/db/migrate-cli.js
          nohup node dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Запуск интерфейса
        working-directory: apps/desktop
        run: |
          nohup pnpm exec vite preview --port 4173 --strictPort > "$RUNNER_TEMP/ui.log" 2>&1 &
          # Веб-приложение для iPhone — как на сайте, по адресу /app/.
          nohup pnpm exec vite preview --outDir dist-web --base /app/ --port 4174 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && curl -sf http://localhost:4174/app/sw.js > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/ui.log" "$RUNNER_TEMP/web.log"; exit 1

      - name: Браузеры Chromium и WebKit (Safari)
        timeout-minutes: 15
        # Установка иногда зависает на стороне GitHub — до трёх попыток по 4 минуты.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm --filter @twm/screenshots exec playwright install --with-deps chromium webkit; then exit 0; fi
            echo "Попытка $attempt не удалась, повторяю"
            sleep 5
          done
          exit 1

      - name: Тестовые данные
        run: pnpm --filter @twm/screenshots seed

      - name: Снимки
        env:
          WEB_URL: http://localhost:4174/app/
        run: |
          pnpm --filter @twm/screenshots shoot
          cat tools/screenshots/out/report.md >> "$GITHUB_STEP_SUMMARY"

      # Копия снимков в журнале (архив в base64) — для проверки на рабочих ветках
      # там, где скачать артефакт нельзя. Обычно снимки удобнее брать из артефакта.
      - name: Снимки в журнале
        if: always() && github.ref != 'refs/heads/main'
        run: |
          if [ -d tools/screenshots/out/screens ]; then
            echo "----- TWM-SCREENS-BEGIN -----"
            tar -czf - -C tools/screenshots/out screens report.md | base64 -w 120
            echo "----- TWM-SCREENS-END -----"
          fi

      - name: Журнал сервера
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true

      - name: Сохранить снимки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: |
            tools/screenshots/out/screens/
            tools/screenshots/out/report.md
            tools/screenshots/out/report.json
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Сборка установщика Windows
    needs: check
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка .exe
        # Адрес сервера вшивается в приложение. Задаётся в настройках репозитория:
        # Settings → Secrets and variables → Actions → Variables → API_URL.
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        # Пробная сборка без подписи обновлений: ключ подписи есть только у выпусков (release.yml).
        run: pnpm --filter @twm/desktop tauri build --config src-tauri/tauri.ci.conf.json

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: TWM-Market-setup-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Пробная сборка для Android. На выпусках APK подписывается ключом владельца
  # (release.yml); здесь — временным ключом, только чтобы проверить сборку.
  android:
    name: Сборка для Android
    needs: check
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: android

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Проект Android
        working-directory: apps/desktop
        run: bash ../../deploy/android-prepare.sh

      - name: Сборка APK
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        # x86_64 — только для проверки на эмуляторе; в выпуск идут ARM-версии.
        run: pnpm tauri android build --apk --target aarch64 --target armv7 --target x86_64 --ci

      - name: Ссылки открывают приложение
        working-directory: apps/desktop/src-tauri/gen/android/app/src/main
        run: |
          grep -q 'android:autoVerify="true"' AndroidManifest.xml
          grep -q 'android:host="twm-market.ru"' AndroidManifest.xml
          grep -q 'android:scheme="twm-market"' AndroidManifest.xml
          grep -B2 -A12 'autoVerify' AndroidManifest.xml
          # Обновление внутри приложения: разрешение и провайдер файла в итоговом манифесте.
          merged="$(find ../../build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -n 1)"
          echo "$merged"
          grep -q 'REQUEST_INSTALL_PACKAGES' "$merged"
          grep -q 'ru.twmmarket.apkupdate.ApkFileProvider' "$merged"
          grep -q 'ru.twmmarket.app.apkupdate' "$merged"

      - name: Подпись временным ключом
        working-directory: apps/desktop
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-only -keypass ci-only -alias ci \
            -keyalg RSA -keysize 2048 -validity 365 -dname "CN=TWM Market CI build" -noprompt
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ci.jks" ANDROID_KEYSTORE_PASSWORD=ci-only ANDROID_KEY_ALIAS=ci ANDROID_KEY_PASSWORD=ci-only \
            bash ../../deploy/android-sign.sh "$RUNNER_TEMP/TWM-Market-test.apk"

      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск на эмуляторе Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash deploy/android-smoke.sh "$RUNNER_TEMP/TWM-Market-test.apk"

      - name: Экран после запуска
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/android-start.png" ]; then
            echo "----- TWM-ANDROID-START-BEGIN -----"
            base64 -w 120 "$RUNNER_TEMP/android-start.png"
            echo "----- TWM-ANDROID-START-END -----"
          fi

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: TWM-Market-android-test-${{ github.sha }}
          path: ${{ runner.temp }}/TWM-Market-test.apk
          if-no-files-found: error
          retention-days: 14
