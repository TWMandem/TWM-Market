name: Game overlay DLL

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/game-overlay/**'
      - '.github/workflows/game-overlay.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Сборка 32-битной DLL
        shell: cmd
        run: cl /nologo /utf-8 /std:c++17 /EHsc /W4 /LD plugins\game-overlay\twm_market_fullscreen.cpp /Fe:twm_market.dll /link user32.lib shell32.lib gdi32.lib d3d9.lib dinput8.lib dxguid.lib
      - name: Проверка архитектуры
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('twm_market.dll')
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x14c) { throw 'DLL должна быть x86' }
      - uses: actions/upload-artifact@v4
        with:
          name: twm-market-game-overlay-x86
          path: twm_market.dll

