# Сборка сервера для VPS: скомпилированный код, зависимости и Node.js
# в одном архиве. Публикуется в релиз server-latest, откуда его берут
# install.sh и команда «twm update» на сервере.
name: Server bundle

on:
  push:
    # На ветках server-* пакет только собирается и проверяется, публикуется — из main.
    branches: [main, "server-*"]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "deploy/**"
      - "apps/site/**"
      # Веб-приложение (twm-market.ru/app/) собирается из кода приложения.
      - "apps/desktop/src/**"
      - "apps/desktop/public/**"
      - "apps/desktop/index.html"
      - "apps/desktop/vite.config.ts"
      - "apps/desktop/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-bundle
  cancel-in-progress: false

jobs:
  bundle:
    name: Сборка и проверка пакета сервера
    # Ubuntu 22.04: сборка запускается на Ubuntu 22.04/24.04 и Debian 12.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twm
          POSTGRES_PASSWORD: twm
          POSTGRES_DB: twm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка
        run: |
          pnpm --filter @twm/shared build
          pnpm --filter @twm/api build
          pnpm --filter @twm/site build
          VITE_API_URL="${{ vars.API_URL || 'https://api.twm-market.ru' }}" pnpm --filter @twm/desktop build:web

      - name: Упаковка
        run: |
          set -euo pipefail
          out=bundle/twm-server
          pnpm --filter @twm/api deploy --prod --legacy "$out/app"
          mkdir -p "$out/bin" "$out/deploy"
          cp "$(command -v node)" "$out/bin/node"
          cp deploy/install.sh deploy/twm.sh deploy/twm-api.service deploy/nginx.conf deploy/nginx-site.conf "$out/deploy/"
          # Сайт twm-market.ru: статические файлы, отдаёт nginx (sudo twm set-site).
          cp -r apps/site/dist "$out/site"
          # Веб-приложение для iPhone и браузеров: twm-market.ru/app/.
          cp -r apps/desktop/dist-web "$out/site/app"
          chmod 755 "$out/deploy/install.sh" "$out/deploy/twm.sh"
          version="$(node -p "require('./apps/api/package.json').version")-$(git rev-parse --short HEAD)"
          echo "$version" > "$out/VERSION"
          test -f "$out/app/dist/index.js"
          test -f "$out/app/migrations/0001_init.sql"
          test -f "$out/site/index.html" && test -f "$out/site/rules/index.html" && test -f "$out/site/privacy/index.html"
          # Шапка и подвал подставлены, встроенных скриптов нет (их запрещает CSP сайта).
          grep -q "support@twm-market.ru" "$out/site/index.html"
          # Связь сайта с приложением для Android: ссылки /l/ открываются в приложении.
          grep -q '"package_name": "ru.twmmarket.app"' "$out/site/.well-known/assetlinks.json"
          # Веб-приложение: страница, служебный скрипт уведомлений, манифест и значок для iPhone.
          test -f "$out/site/app/index.html" && test -f "$out/site/app/sw.js" && test -f "$out/site/app/manifest.webmanifest"
          test -f "$out/site/app/icons/apple-touch-icon.png"
          grep -q 'rel="manifest" href="/app/manifest.webmanifest"' "$out/site/app/index.html"
          grep -q 'src="/app/assets/' "$out/site/app/index.html"
          # Собрано для настоящего сервера, а не для localhost.
          if grep -rq "localhost:3000" "$out/site/app/assets"; then echo "веб-приложение собрано с адресом localhost"; exit 1; fi
          if grep -rq "include:" "$out/site" --include=*.html; then echo "не подставлены шапка или подвал"; exit 1; fi
          if grep -rqE "<script>|<script type=\"module\">" "$out/site" --include=*.html; then echo "встроенный скрипт в сайте"; exit 1; fi
          tar -czf twm-server-linux-x64.tar.gz -C bundle twm-server
          sha256sum twm-server-linux-x64.tar.gz > twm-server-linux-x64.tar.gz.sha256
          du -sh twm-server-linux-x64.tar.gz
          echo "Версия: $version"

      - name: Проверка запуска с настоящей базой
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: "3000"
          DATABASE_URL: postgres://twm:twm@localhost:5432/twm
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          CODE_SECRET: ci-only-secret-fedcba9876543210fedcba9876543210
          UPLOAD_DIR: /tmp/twm-uploads
        run: |
          set -euo pipefail
          cd bundle/twm-server/app
          ../bin/node dist/index.js > /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health
          echo
          curl -fsS -o /tmp/catalog.json http://127.0.0.1:3000/v1/catalog
          head -c 300 /tmp/catalog.json
          echo
          kill %1 || true
          cat /tmp/server.log | tail -n 20

      - name: Проверка настроек сайта (nginx)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light >/dev/null
          sudo mkdir -p /opt/twm && sudo cp -r bundle/twm-server /opt/twm/current
          sed "s/__SITE__/site.test/g" deploy/nginx-site.conf | sudo tee /etc/nginx/sites-enabled/twm-site >/dev/null
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          get() { curl -fsS -D /tmp/headers -o /tmp/body -H "Host: site.test" "http://127.0.0.1$1"; }
          get /app/
          grep -qi "worker-src 'self'" /tmp/headers && grep -qi "cache-control: no-cache" /tmp/headers && grep -q "/app/manifest.webmanifest" /tmp/body
          get /app/sw.js
          grep -qi "content-type: application/javascript\|content-type: text/javascript" /tmp/headers && grep -qi "cache-control: no-cache" /tmp/headers
          get /app/manifest.webmanifest
          grep -qi "content-type: application/manifest+json" /tmp/headers && grep -q '"start_url"' /tmp/body
          asset="$(grep -o '/app/assets/[^"]*\.js' bundle/twm-server/site/app/index.html | head -n 1)"
          get "$asset"
          grep -qi "immutable" /tmp/headers
          get /
          grep -qi "form-action 'none'" /tmp/headers
          echo "nginx: сайт и веб-приложение отдаются правильно"

      - name: Публикация в релиз server-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view server-latest >/dev/null 2>&1; then
            gh release create server-latest --prerelease --title "Сервер TWM Market (последняя сборка)" \
              --notes "Сборка сервера для VPS. Установка и обновление описаны в deploy/README.md. Файлы обновляются автоматически при каждом изменении сервера в main."
          fi
          gh release upload server-latest twm-server-linux-x64.tar.gz twm-server-linux-x64.tar.gz.sha256 deploy/install.sh --clobber
