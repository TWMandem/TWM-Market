# База данных для разработки: docker compose up -d
# Адрес подключения: postgres://twm:twm@localhost:5432/twm
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twm
      POSTGRES_PASSWORD: twm
      POSTGRES_DB: twm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - twm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twm"]
      interval: 5s
      retries: 10

volumes:
  twm-pgdata:
