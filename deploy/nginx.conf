# nginx для TWM Market. __DOMAIN__ подставляет install.sh,
# certbot потом добавляет сюда HTTPS и переадресацию с http.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Скриншоты до 10 МБ плюс запас на заголовки формы.
    client_max_body_size 12m;
    server_tokens off;

    # Загруженные файлы отдаёт сам nginx: имена случайные и не меняются.
    location /media/ {
        alias /var/lib/twm/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        # Только чтение файлов, без списка папок.
        autoindex off;
        types {
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            video/webm webm;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
