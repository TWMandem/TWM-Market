# Сайт twm-market.ru: статические страницы из текущей сборки (/opt/twm/current/site).
# __SITE__ подставляет «twm set-site», certbot потом добавляет HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __SITE__;

    server_tokens off;
    charset utf-8;
    root /opt/twm/current/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Скрипты и стили только свои; к GitHub — за номером последней версии.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # Цифры площадки для главной страницы — с сервера API, без личных данных.
    location = /stats.json {
        proxy_pass http://127.0.0.1:3000/v1/public/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ссылка на объявление (twm-market.ru/l/ID): страницу собирает сервер API —
    # с заголовком, ценой и картинкой для карточки в Discord, VK и Telegram.
    # Стили страницы встроены в неё, поэтому здесь свои заголовки безопасности.
    location /l/ {
        proxy_pass http://127.0.0.1:3000/share/l/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    # Фото объявлений и иконки предметов — для страниц-ссылок и карточек в мессенджерах.
    location /media/ {
        alias /var/lib/twm/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        autoindex off;
        types {
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            video/webm webm;
        }
        default_type application/octet-stream;
    }

    # Файлы сборки с хешем в имени не меняются.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
