[package]
name = "twm-market"
version = "0.2.0"
description = "TWM Market — торговая площадка игроков Amazing Online"
authors = ["TWM Market contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Имя библиотеки отличается от имени пакета — это требование Tauri для Windows.
name = "twm_market_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Системное хранилище учётных данных (на Windows — «Диспетчер учётных данных»).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
