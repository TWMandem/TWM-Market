[package]
name = "twm-market"
version = "0.8.0"
description = "TWM Market — торговая площадка игроков Amazing Online"
authors = ["TWM Market contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Имя библиотеки отличается от имени пакета — это требование Tauri для Windows.
name = "twm_market_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Всплывающие уведомления Windows о новых сообщениях и сделках.
tauri-plugin-notification = "2"
# Второй запуск не открывает новое окно, а показывает уже запущенное (оно может быть в трее).
tauri-plugin-single-instance = "2"
# Автообновление: проверка подписанного выпуска на GitHub и установка поверх.
tauri-plugin-updater = "2"
# Перезапуск приложения после установки обновления.
tauri-plugin-process = "2"
# Выбор папки с игрой для 3D-просмотра одежды.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Системное хранилище учётных данных (на Windows — «Диспетчер учётных данных»).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
