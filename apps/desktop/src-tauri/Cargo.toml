[package]
name = "twm-market"
version = "0.23.1"
description = "TWM Market — торговая площадка игроков Amazing Online"
authors = ["TWM Market contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Имя библиотеки отличается от имени пакета — это требование Tauri для Windows.
name = "twm_market_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Всплывающие уведомления о новых сообщениях и сделках (Windows и Android).
tauri-plugin-notification = "2"
# Ссылки twm-market://listing/ID со страницы объявления на сайте открывают его в приложении.
tauri-plugin-deep-link = "2"
# Выбор папки с игрой для 3D-просмотра одежды (на компьютере); на телефоне — выбор фото.
tauri-plugin-dialog = "2"
# Ссылки во внешнем браузере: скачивание обновления на Android.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Только для компьютера: трей, один экземпляр, автообновление, хранилище учётных данных Windows.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Второй запуск не открывает новое окно, а показывает уже запущенное (оно может быть в трее).
# С deep-link ссылка twm-market://… из браузера передаётся уже запущенному приложению.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Автообновление: проверка подписанного выпуска на GitHub и установка поверх.
tauri-plugin-updater = "2"
# Перезапуск приложения после установки обновления.
tauri-plugin-process = "2"
# Системное хранилище учётных данных (на Windows — «Диспетчер учётных данных»).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# Только для Android: скачать обновление внутри приложения и открыть установщик.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-apk-update = { path = "plugins/apk-update" }
# Только для Android: фоновая проверка уведомлений, когда приложение закрыто.
tauri-plugin-background-notify = { path = "plugins/background-notify" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
